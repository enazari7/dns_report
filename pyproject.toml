[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartdns-dashboard"
version = "1.2.0"
description = "Observability dashboard for a Smart DNS / SNI-proxy deployment"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "erfan", email = "777erfan7@gmail.com" }]
keywords = ["dns", "dnsdist", "sniproxy", "smartdns", "observability",
            "dashboard"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: Name Service (DNS)",
  "Topic :: System :: Networking :: Monitoring",
]

dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27,<1.0",
  "jinja2>=3.1,<4.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/enazari7/dns_report"
Issues = "https://github.com/enazari7/dns_report/issues"
Changelog = "https://github.com/enazari7/dns_report/blob/main/CHANGELOG.md"

[project.scripts]
smartdns-dashboard = "smartdns_dash.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smartdns_dash = ["templates/*.html", "static/*"]

# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "needs_root: requires root (writes /etc, restarts services)",
  "needs_network: requires outbound network access",
]

[tool.coverage.run]
source = ["smartdns_dash"]
omit = ["*/__main__.py"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
  "E501",    # long lines are checked by hand; some messages read better long
  "B008",    # FastAPI's Depends() in defaults is the documented pattern
  "SIM108",  # ternaries are not always clearer
  "SIM105",  # contextlib.suppress hides which call is allowed to fail
  "B904",    # the wrapped errors are shown to users; a chained traceback adds
             # nothing and can leak paths
  "E741",    # `l` for a line in a tight loop reads fine
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

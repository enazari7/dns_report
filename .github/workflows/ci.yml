name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Tests
        run: pytest -q --cov --cov-report=term-missing

      - name: Console script is installed and runnable
        run: |
          smartdns-dashboard --version
          smartdns-dashboard secret | grep -q '^secret_key = '

      - name: Refuse a DNS-stack port
        # The dashboard must never be able to take a port the resolver needs.
        run: |
          python - <<'PY'
          from smartdns_dash import preflight
          for port in (53, 80, 443, 5199, 8083, 9100, 22):
              v = preflight.check_port(port)
              assert v["fatal"], f"port {port} was not refused"
          print("all DNS-stack ports refused")
          PY

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JS syntax
        run: node --check src/smartdns_dash/static/app.js

      - name: Translation catalog is complete
        # Every data-i18n key used in the HTML must exist in the JS catalog,
        # with a non-empty string in both languages.
        run: node .github/scripts/check-i18n.mjs

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the single-file installer
        run: python tools/build_installer.py

      - name: Payload verifies
        run: python install.py --check-only

      - name: Payload survives a text-mode transfer
        # A Windows SFTP client in text mode rewrites the line endings. The
        # installer is built to shrug that off; prove it every build.
        run: |
          python - <<'PY'
          data = open("install.py", "rb").read()
          open("crlf.py", "wb").write(data.replace(b"\n", b"\r\n"))
          PY
          python crlf.py --check-only

      - name: A damaged payload is detected
        run: |
          python - <<'PY'
          s = open("install.py", encoding="utf-8").read()
          i = s.index("PAYLOAD = ") + 400
          s = s[:i] + ("A" if s[i] != "A" else "B") + s[i + 1:]
          open("bad.py", "w", encoding="utf-8").write(s)
          PY
          if python bad.py --check-only; then
            echo "corruption was NOT detected"; exit 1
          fi
          echo "corruption detected as expected"

      - uses: actions/upload-artifact@v4
        with:
          name: install.py
          path: install.py

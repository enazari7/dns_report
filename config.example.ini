; Smart DNS Observability Dashboard - configuration
; Install to /etc/smartdns-dashboard/config.ini  (chmod 600, root:root)
;
; Nothing here is specific to a particular server. Every identity value can be
; left as `auto` and will be discovered at runtime, so a cloned VM with a
; different address works with no edits. See README section 6.
;
; Anything after ';' or '#' at the start of a line is a comment. Do NOT put
; inline comments after values - configparser keeps them as part of the value.

[server]
; Label shown in the UI header. `auto` uses the system hostname.
name = auto

; The address that listed domains are spoofed to - i.e. the address clients
; connect to on 80/443. On a MikroTik/DNAT topology this lives on the router,
; not on this box, so it cannot be read off an interface.
;   auto        -> read it out of the generated dnsdist config (recommended)
;   1.2.3.4     -> pin it explicitly
public_ip = auto

; This machine's own address, used as the default resolver for the Lookup
; panel. `auto` picks the first global IPv4.
local_ip = auto

; Listen addresses, comma separated.
;   127.0.0.1   -> SSH tunnel or a local reverse proxy only (safest)
;   10.0.0.5    -> a WireGuard/VPN address
;   0.0.0.0     -> all interfaces; requires exposed or behind_proxy below
bind = 127.0.0.1

; The dashboard binds exactly one TCP port and never touches 53/80/443. Ports
; belonging to the DNS/proxy stack (53, 80, 443, 5199, 8083, 9100, 22, ...) are
; refused outright at startup. `doctor` shows what else is listening and
; suggests a free port.
port = 9443

; Set true when a reverse proxy (nginx, Caddy, Traefik) sits in front. Makes
; the app trust X-Forwarded-For/Proto from `forwarded_allow_ips`, so the login
; rate limiter sees real client addresses instead of the proxy's.
behind_proxy = false
forwarded_allow_ips = 127.0.0.1

; Set true if you are publishing this port yourself with no proxy. This is
; only an acknowledgement - it does not add protection. Read README section 4.
exposed = false

; Source addresses allowed to reach the dashboard at all, comma separated.
; Single addresses or CIDR networks. Empty = no restriction.
; This is the in-app substitute for an nginx allow/deny block when there is no
; reverse proxy on the box. It runs before the login, but it is a second lock,
; never a replacement for the password.
;   allow_ips = 203.0.113.45, 10.8.0.0/24
allow_ips =

; Serve HTTPS directly. Leave both empty when a proxy terminates TLS.
; Generate a self-signed pair with:
;   smartdns-dashboard make-cert --write-config
tls_cert =
tls_key =

; Serve under a sub-path, e.g. /dns for  https://host/dns/ . Leave empty when
; the dashboard has its own hostname or port.
root_path =

; Default interface language: en or fa. Each browser can override it with the
; toggle in the header, and that choice is remembered locally.
language = en

[auth]
username = admin
; Generate with:  smartdns-dashboard hash-password
password_hash =
; Generate with:  python3 -c "import secrets;print(secrets.token_hex(32))"
secret_key =
session_hours = 12
; Failed logins allowed per source IP per 15 minutes before a lockout.
max_login_attempts = 5

; Optional second account that can see everything and change nothing. Useful
; when someone else needs to look without being able to break anything. The
; restriction is enforced server-side, not by hiding buttons.
;   smartdns-dashboard hash-password     (then paste below)
viewer_username =
viewer_password_hash =

[paths]
domains = /etc/smartdns/domains.txt
generated_proxy = /etc/smartdns/generated/domains.proxy
; Read (never written) to discover the spoof address when public_ip = auto.
dnsdist_conf = /etc/dnsdist/dnsdist.conf
sniproxy_conf = /etc/sniproxy.conf
env_file = /etc/smartdns/smartdns.env
update_script = /usr/local/bin/update-smartdns.sh
backup_dir = /root/smartdns-backups
https_log = /var/log/sniproxy/https_access.log
http_log = /var/log/sniproxy/http_access.log
error_log = /var/log/sniproxy/error.log
update_log = /var/log/smartdns/update.log

[dnsdist]
console = 127.0.0.1:5199
; Name of the variable inside smartdns.env holding the console key.
key_var = SMARTDNS_DNSDIST_KEY
; How many ring-buffer entries grepq() should scan. Higher = more CPU per poll.
grepq_limit = 600
; dnsdist web/API endpoint for the stats panel. Leave api_url empty to disable.
api_url = http://127.0.0.1:8083
api_key_var = SMARTDNS_DNSDIST_API_KEY

[services]
; Restarted, in this order, after an allow-list change.
restart = sniproxy dnsdist
; The unit whose start time is compared against domains.txt mtime.
staleness_unit = sniproxy

[peer]
; The other server, for the two-server diff. Leave host empty to use
; paste-only mode. Not required - a single-server deployment just turns this
; off.
enabled = false
name = peer
host =
ssh_user = root
ssh_port = 22
ssh_key = /root/.ssh/id_ed25519_smartdns
ssh_timeout = 8

[poll]
; Milliseconds. Keep these conservative if the box also carries live traffic.
log_ms = 1000
grepq_ms = 5000
status_ms = 15000
; Rows kept in the in-memory live feed ring.
feed_ring = 2000

[portwatch]
; tcpdump-based watcher for TCP SYNs that never get a SYN-ACK. Off by default:
; it runs a continuous capture. Turn on only while debugging.
enabled = false
interface = any
ignore_ports = 53,80,443
; A SYN with no SYN-ACK after this many seconds is reported as unanswered.
timeout_s = 3
; Hard stop so a forgotten capture cannot run forever.
max_runtime_s = 900

[history]
; Persistent diagnostic history in SQLite: the events log, the audit trail, the
; domain first-seen registry, and time-bucketed traffic totals for the charts.
;
; NOT AN ACCOUNTING SOURCE. Rows are keyed by client IP, and addresses change
; hands - a figure here describes an address over a window of time, not a
; person. Accounting belongs in a system that knows about accounts. The short
; retention default is part of that: per-address totals do not get more
; meaningful with age, and a long history invites exactly this misuse.
enabled = true
path = /var/lib/smartdns-dashboard/history.db
retention_days = 14

[alerts]
; Conditions are detected, opened and closed in the history, then shown in the
; Events panel with a badge in the header. A condition that stays true is one
; event with a duration, not one row per poll, so "when did this start?" has an
; answer.
enabled = true

; Write alerts to the journal. On by default so the delivery path is exercised
; from day one rather than written blind the first time it is needed.
log = true

; Share of recent proxied connections that must fail (origin NONE or no SNI)
; before it counts as an incident. Needs at least 20 connections in the window,
; so two failures out of three at 4am stay quiet.
problem_threshold = 0.25

; Lowest severity worth notifying about: critical, warning or info.
min_severity = warning

; --- external delivery, all off until configured -------------------------
; Generic JSON POST. Slack, Gotify and most bots fit behind this.
webhook_url =
webhook_template =
; Telegram bot. Both values are needed before anything is sent.
telegram_token =
telegram_chat_id =

[probe]
; Active reachability test for a candidate domain, run from this server: does
; it complete a TLS handshake with the name as SNI on 443, answer HTTP with a
; Host header on 80, and is it reachable directly. Turns the one manual
; decision from a guess into a judgement with evidence. Read-only; it never
; adds anything.
enabled = true

; Resolver used by the probe. It must NOT be this server: the local resolver
; returns the spoof address for a listed name, which would make the probe test
; the proxy against itself.
resolver = 1.1.1.1
timeout = 4.0

[metrics]
; Prometheus text endpoint at /metrics. Off by default.
;
; Only aggregate series are exposed - no per-client byte counters. Prometheus
; keeps data far longer than the retention window above, so per-address totals
; there would be an accounting record by the back door.
enabled = false

; Required when enabled: a scraper cannot log in, so a token is the access
; control. Send it as ?token=... or "Authorization: Bearer ...".
token =

[triage]
; An unauthenticated page at /triage that a player can open themselves. It
; reports only what the dashboard has observed about the caller's own address.
;
; It cannot read the MikroTik's Permited address-list, so when DNS clearly
; works and no proxy connection ever arrives it says that points at the
; Permited list - not that it proves it. Off by default.
enabled = false
